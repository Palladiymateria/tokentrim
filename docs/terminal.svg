<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title">
<title id="title">TokenTrim Terminal Session: Trimming a Python file and copying to clipboard</title>
<rect width="1200" height="520" rx="20" fill="#0b1120"/>
<path d="M20 0h1160q20 0 20 20v40H0V20Q0 0 20 0" fill="#1e293b"/>
<circle cx="30" cy="30" r="6" fill="#ef4444"/>
<circle cx="52" cy="30" r="6" fill="#f59e0b"/>
<circle cx="74" cy="30" r="6" fill="#10b981"/>
<text x="600" y="36" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">TOKENTRIM / INTERACTIVE SESSION</text>

<g font-family="Consolas,Menlo,monospace" font-size="17">
  <!-- Command -->
  <text x="40" y="105" fill="#f8fafc"><tspan fill="#10b981">$ </tspan>tokentrim src/api/users.py --clip -s</text>

  <!-- Output line -->
  <text x="40" y="145" fill="#10b981">✓ Trimmed code copied to clipboard!</text>

  <!-- Stats Box Table -->
  <text x="40" y="190" fill="#64748b">┌──────────────────────────────────────────────┐</text>
  <text x="40" y="220" fill="#64748b">│ <tspan fill="#f8fafc" font-weight="bold">tokentrim summary: users.py                 </tspan>│</text>
  <text x="40" y="250" fill="#64748b">├──────────────────────────────────────────────┤</text>
  <text x="40" y="280" fill="#64748b">│ <tspan fill="#e2e8f0">Original lines:   1,420                      </tspan>│</text>
  <text x="40" y="310" fill="#64748b">│ <tspan fill="#e2e8f0">Trimmed lines:    184 </tspan><tspan fill="#94a3b8">(-87.0%)                 </tspan>│</text>
  <text x="40" y="340" fill="#64748b">│ <tspan fill="#e2e8f0">Original tokens:  ~8,920                     </tspan>│</text>
  <text x="40" y="370" fill="#64748b">│ <tspan fill="#e2e8f0">Trimmed tokens:   ~1,240                     </tspan>│</text>
  <text x="40" y="400" fill="#64748b">│ <tspan fill="#e2e8f0">Token reduction:  </tspan><tspan fill="#10b981" font-weight="bold">-86.1%                       </tspan>│</text>
  <text x="40" y="430" fill="#64748b">│ <tspan fill="#e2e8f0">Est. cost saved:  </tspan><tspan fill="#10b981">$0.0230 / prompt            </tspan>│</text>
  <text x="40" y="460" fill="#64748b">└──────────────────────────────────────────────┘</text>
</g>

<path d="M40 480h1120" stroke="#1e293b"/>
<text x="40" y="504" fill="#38bdf8" font-family="Segoe UI,Arial,sans-serif" font-size="14">READY TO PASTE INTO CLAUDE / CHATGPT / CURSOR</text>
<text x="1160" y="504" text-anchor="end" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="14">Zero dependencies · 100% local AST parsing</text>
</svg>
