[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentrim"
version = "0.1.0"
description = "Shrink your codebase by 60-80% for LLM context prompts. Zero dependencies, 100% local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Palladiy" }
]
keywords = [
    "llm",
    "prompt-engineering",
    "context-window",
    "token-saver",
    "ast",
    "developer-tools",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Palladiymateria/tokentrim"
Repository = "https://github.com/Palladiymateria/tokentrim"
Issues = "https://github.com/Palladiymateria/tokentrim/issues"

[project.scripts]
tokentrim = "tokentrim.cli:main"
